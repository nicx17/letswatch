name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run test suite
        run: npm run test

      - name: Run build checks
        run: npm run build

      # The server runs TypeScript directly on Node, so prove the production entry
      # point actually boots and serves requests, not just that it type-checks.
      - name: Smoke-test production server
        working-directory: server
        env:
          NODE_ENV: production
          APP_URL: http://127.0.0.1:4000
          HOST: 127.0.0.1
          PORT: 4000
        run: |
          npm run start &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4000/healthz; then
              curl -fsS -o /dev/null http://127.0.0.1:4000/
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy" >&2
          exit 1
